spring.application.name=ticketflow-user-service

# Server (detrás del API Gateway)
server.port=${SERVER_PORT:8081}

# Eureka service discovery
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=true

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/user}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway: the schema is created and evolved only through migrations.
# baseline-on-migrate keeps databases previously created by ddl-auto=update usable.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-migration-naming=true

# JWT (shared secret with the rest of the TicketFlow microservices)
jwt.secret=${JWT_SECRET:ticketflow-dev-secret-key-change-me-in-production-2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Default administrator created on startup when the email does not exist.
# Disable it in production with BOOTSTRAP_ADMIN_ENABLED=false or provide your own credentials.
bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
bootstrap.admin.name=${BOOTSTRAP_ADMIN_NAME:Administrador TicketFlow}
bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@ticketflow.com}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:Admin123!}
bootstrap.admin.phone=${BOOTSTRAP_ADMIN_PHONE:}

# Virtual threads (Java 21+) - improves performance for blocking I/O (Argon2)
spring.threads.virtual.enabled=true

# Actuator (health probes)
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always

# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html