spring.application.name=ticketflow-user-service

# Server (detrás del API Gateway)
server.port=${SERVER_PORT:8081}

# Eureka service discovery
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=true

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/TicketFlow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT (shared secret with the rest of the TicketFlow microservices)
jwt.secret=${JWT_SECRET:ticketflow-dev-secret-key-change-me-in-production-2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Actuator (health probes)
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always

# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html